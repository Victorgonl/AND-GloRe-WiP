dataset_name: "whoiswhov2"

networks_path: "data/whoiswhov2/networks_test.pt"
splits: ["test"]

results_folder: "results/"
log_file: "logs/experiment-whoiswhov2.log"
outputs_path: "outputs/whoiswhov2.pt"

selected_names: null 

training_args:
  seeds: [2026]
  epochs: 70
  lr: 0.00008
  l2_coef: 0.0001
  feat_mask: 0.2
  adj_mask: 0.1
  hidden_dim: 128
  embed_dim: 64
  proj_dim: 64
  dropout: 0.1
  gnn_hidden_dim: 256
  gnn_dropout: 0.1
  gnn_alpha: 0.2
  temperature: 0.1
  min_distance_threshold: 0.1
  max_distance_threshold: 0.3
  step: 0.05
  device: "cuda"