dataset_name: "whoiswhov1"

networks_path: "data/whoiswhov1/andglore_networks.pt"
splits: ["test"]
#splits: ["train", "val", "test"]

results_folder: "results/"
networks_log_file: "logs/andglore_networks_whoiswhov1.log"
log_file: "logs/andglore_experiment_whoiswhov1.log"
outputs_path: "outputs/andglore_whoiswhov1.pt"

selected_names: null
#selected_names: ["gang_li", "jie_tang"] # Specific names

max_org_affiliation: null

training_args:
  seeds: [2026]
  epochs: 20
  lr: 0.0001
  l2_coef: 0.0001
  feat_mask: 0.1
  adj_mask: 0.2
  hidden_dim: 128
  embed_dim: 64
  proj_dim: 64
  dropout: 0.1
  gnn_hidden_dim: 256
  gnn_dropout: 0.1
  gnn_alpha: 0.2
  temperature: 0.1
  min_distance_threshold: 0.1
  max_distance_threshold: 0.3
  step: 0.05
  device: "cuda"
