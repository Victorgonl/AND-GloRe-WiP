dataset_name: "whoiswhov2"

preprocessed_path: "data/whoiswhov2/preprocessed.csv"
features_path: "data/whoiswhov2/features.pt"
networks_path: "data/whoiswhov2/mccg_networks_test.pt"
splits: ["test"]

results_folder: "results/"
networks_log_file: "logs/mccg_networks_whoiswhov2.log"
log_file: "logs/mccg_experiment_whoiswhov2.log"
outputs_path: "outputs/mccg_whoiswhov2.pt"

selected_names: null

max_org_affiliation: null

training_args:
  seeds: [2026]
  epochs: 50
  lr: 0.0001
  layer_shape: [100, 256, 256]
  dim_proj_multiview: 128
  dim_proj_cluster: 128
  drop_scheme: "degree"
  drop_feature_rate_view1: 0.2
  drop_feature_rate_view2: 0.1
  drop_edge_rate_view1: 0.3
  drop_edge_rate_view2: 0.5
  th_a: 1
  th_o: 0.5
  th_v: 2
  db_eps: 0.1
  db_min: 3
  l2_coef: 0.4
  w_cluster: 0.6
  t_multiview: 0.3
  t_cluster: 0.3
  device: "cpu"
