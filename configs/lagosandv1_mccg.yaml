dataset_name: "lagosandv1"

preprocessed_path: "data/lagosandv1/preprocessed.csv"
features_path: "data/lagosandv1/features.pt"
networks_folder: "data/lagosandv1"
networks_path: "data/lagosandv1/networks_test_mccg.pt"
splits: ["test"]

results_folder: "results/"
networks_log_file: "logs/networks-lagosandv1_mccg.log"
log_file: "logs/experiment-lagosandv1_mccg.log"
outputs_path: "outputs/lagosandv1_mccg.pt"

selected_names: null

training_args:
  seeds: [2026]
  epochs: 50
  lr: 0.0001
  layer_shape: [100, 256, 256]
  dim_proj_multiview: 128
  dim_proj_cluster: 128
  drop_scheme: "degree"
  drop_feature_rate_view1: 0.4
  drop_feature_rate_view2: 0.2
  drop_edge_rate_view1: 0.4
  drop_edge_rate_view2: 0.5
  th_a: 1
  th_o: 0.5
  th_v: 2
  db_eps: 0.1
  db_min: 3
  l2_coef: 0.2
  w_cluster: 0.6
  t_multiview: 0.3
  t_cluster: 0.3
  device: "cuda"
